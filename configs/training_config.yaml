# ============================================================
# MRTF Training Configuration
# ============================================================


training:


  seed: 42


  epochs: 100


  batch_size: 16


  optimizer:

    type: AdamW

    learning_rate: 0.0001

    weight_decay: 0.00001



  scheduler:

    type: CosineAnnealing

    warmup_epochs: 5



  loss:

    classification:

      type: CrossEntropyLoss


    total_loss:

      formulation:

        classification_weight: 1.0
        explanation_weight: 0.2
        reinforcement_weight: 0.1



# ------------------------------------------------------------
# Validation
# ------------------------------------------------------------

validation:

  strategy:

    type: subject_wise_split


  split_ratio:

    train: 0.70
    validation: 0.15
    test: 0.15



  early_stopping:

    enabled: true

    patience: 15



# ------------------------------------------------------------
# Data Leakage Prevention
# ------------------------------------------------------------

leakage_control:

  normalization:

    training_only: true


  augmentation:

    training_only: true


  latent_alignment:

    training_only: true


  threshold_selection:

    validation_only: true



# ------------------------------------------------------------
# Hardware
# ------------------------------------------------------------

hardware:

  gpu:

    enabled: true

    device: cuda


  mixed_precision:

    enabled: true


  workers: 8



# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

logging:

  save_checkpoints: true

  checkpoint_frequency: 10


  tensorboard:

    enabled: true


  output_directory:

    results/
